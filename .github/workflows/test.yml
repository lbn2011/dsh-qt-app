# Run the TypeScript typecheck, the unit tests, the QML lint, the Qt Quick Test
# suites and the dsh-qt-napi addon build.
#
# All test execution happens here — never on the development machine.
# The workflow assumes the repository root is dsh-qt-app/ (see docs/ci.md).
name: test

on:
  push:
    branches: [main, dev/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.7.3
  NODE_VERSION: "22.19.0"
  # The Markdown/GFM parser lives in its own repository; the addon job checks it
  # out as a sibling directory and the Qt jobs consume its prebuild artifact.
  NAPI_REPO: lbn2011/dsh-qt-napi
  # Full commit, not a branch: the addon is a separate repository and an
  # unpinned checkout would let a rebuilt cmark-gfm change this app silently.
  NAPI_SHA: 87084a6901297a4fe9af997d4b8cdf9d829b0f67

jobs:
  # ---------------------------------------------------------------------------
  # dsh-qt-napi: compile the cmark-gfm N-API addon from source.
  #
  # This is what proves the "cmark-gfm 0.30+" criterion in CI: the addon vendors
  # cmark-gfm and compiles it into qt-bridge.node. The Qt host never links cmark
  # itself (it talks to Node over the stdio bridge and receives an AST), so the
  # addon build is the only place cmark is compiled — and therefore the job that
  # has to stay green for Markdown rendering to work at all.
  # ---------------------------------------------------------------------------
  napi:
    name: napi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS is intentionally absent: the shared macOS runner pool is an
        # accepted gap for this project (see docs/ci.md § Known gaps).
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout dsh-qt-napi
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NAPI_REPO }}
          ref: ${{ env.NAPI_SHA }}
          path: dsh-qt-napi


      - name: Assert addon checkout matches the pinned SHA
        shell: bash
        working-directory: dsh-qt-napi
        run: |
          got="$(git rev-parse HEAD)"
          if [ "$got" != "$NAPI_SHA" ]; then
            echo "::error::dsh-qt-napi checkout is $got, expected pinned $NAPI_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --ignore-scripts keeps the install hook from compiling before the
      # explicit build step, so a compile failure is reported against "Build"
      # rather than buried inside dependency installation.
      - name: Install addon dependencies
        working-directory: dsh-qt-napi
        run: npm install --ignore-scripts

      # node-gyp is invoked through the node binary instead of through
      # scripts/build.mjs. That script resolves node-gyp to a local
      # node_modules/.bin shim and otherwise falls back to `npx` — on Windows both
      # are `.cmd` files, and spawning a `.cmd` without a shell throws EINVAL on
      # Node >= 18.20 / 20.12 (the CVE-2024-27980 hardening). Pinning the Node
      # version does not undo that, so the JS entry point is called directly and
      # the toolchain version is pinned here instead. scripts/build.mjs remains
      # what local builds use; the two steps below reproduce it for CI.
      - name: Install pinned node-gyp
        working-directory: dsh-qt-napi
        # --ignore-scripts matters: without it npm would also run this package's
        # own install hook, which compiles through the very shim we are avoiding.
        run: npm install --no-save --ignore-scripts node-gyp@11

      - name: Build addon (compiles vendored cmark-gfm)
        working-directory: dsh-qt-napi
        run: node node_modules/node-gyp/bin/node-gyp.js rebuild

      # Mirrors the staging half of scripts/build.mjs: the loader and the uploaded
      # artifact both expect prebuild/<platform>-<arch>/qt-bridge.node. Kept as a
      # node one-liner so it behaves identically in bash and in PowerShell.
      - name: Stage prebuild binary
        working-directory: dsh-qt-napi
        run: |
          node -e "const{existsSync,mkdirSync,copyFileSync}=require('node:fs');const t=process.platform+'-'+process.arch;const src='build/Release/qt-bridge.node';if(!existsSync(src)){console.error('missing '+src);process.exit(1)}mkdirSync('prebuild/'+t,{recursive:true});copyFileSync(src,'prebuild/'+t+'/qt-bridge.node');console.log('staged prebuild/'+t+'/qt-bridge.node')"

      - name: Verify addon
        working-directory: dsh-qt-napi
        run: npm run verify

      # The addon's loader-integration suite drives the *host* loader
      # (dsh-qt-app/lib/qt-bridge/napi-loader.js) against this package, and resolves
      # the host as a sibling directory literally named dsh-qt-app. Without a
      # compiled host present, that suite fails with 'run "pnpm -C dsh-qt-app build"
      # first', so the host is checked out and built here as well.
      - name: Checkout dsh-qt-app (host loader under test)
        uses: actions/checkout@v4
        with:
          path: dsh-qt-app

      # This job's workspace root is the addon checkout, which has no package.json,
      # so pnpm/action-setup cannot infer the version from the default location;
      # point it at the host's manifest to keep packageManager the single source.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: dsh-qt-app/package.json

      - name: Build host TypeScript package
        run: pnpm -C dsh-qt-app install --frozen-lockfile && pnpm -C dsh-qt-app build

      - name: Addon unit tests
        working-directory: dsh-qt-napi
        run: npm test

      # The loader in src/qt-bridge/napi-loader.ts discovers the addon through
      # prebuild/<platform>-<arch>/, which is exactly what gets uploaded here.
      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-${{ runner.os }}-${{ runner.arch }}
          path: dsh-qt-napi/prebuild/
          if-no-files-found: error
          retention-days: 7

  typescript:
    name: typescript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm version comes from "packageManager" in package.json; passing an
      # explicit `version:` as well makes action-setup fail.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Assert pinned addon SHA (package.json)
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const want=process.env.NAPI_SHA; const got=p.dshQtNapi&&p.dshQtNapi.commit; if(got!==want){console.error('addon SHA lock mismatch: package.json='+got+' env='+want);process.exit(1)} console.log('addon SHA lock ok: '+got)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src + tests)
        run: node scripts/gate.mjs -- pnpm typecheck

      - name: Unit tests
        run: node scripts/gate.mjs -- pnpm test

  # ---------------------------------------------------------------------------
  # napi integration: run the TypeScript suite with a real addon on disk.
  #
  # The unit suite is hermetic (it must pass on a machine without the addon), so
  # it cannot prove the napi-loader discovery path works against a real binary.
  # This job downloads the prebuild and asserts the loader finds and uses it.
  # ---------------------------------------------------------------------------
  napi-integration:
    name: napi integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: napi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download addon prebuild
        uses: actions/download-artifact@v4
        with:
          name: napi-prebuild-Linux-X64
          path: dsh-qt-napi/prebuild

      - name: Build TypeScript
        run: pnpm build

      # Two discovery paths matter and both are checked here, because they fail
      # independently: an explicit DSH_QT_NAPI_PATH (what CI sets) and the
      # search-root rule `<root>/dsh-qt-napi/prebuild/<triple>/`, which is how a
      # packaged app finds the addon with no environment help at all.
      - name: Addon is discovered via DSH_QT_NAPI_PATH
        env:
          DSH_QT_NAPI_PATH: ${{ github.workspace }}/dsh-qt-napi/prebuild/linux-x64/qt-bridge.node
        run: |
          node --input-type=commonjs - <<'JS'
          const loader = require('./lib/qt-bridge/napi-loader.js');
          const loaded = loader.loadNapiModule({ searchRoots: [] , env: process.env });
          if (!loaded || loaded.degraded || !loaded.bridge) {
            console.error('addon not discovered via env:', JSON.stringify(loaded && loaded.source));
            process.exit(1);
          }
          if (loaded.source !== 'env') {
            console.error('expected source "env", got', loaded.source);
            process.exit(1);
          }
          console.log('discovered via', loaded.source);
          JS

      - name: Addon is discovered by search root (packaged-app layout)
        run: |
          node --input-type=commonjs - <<'JS'
          const loader = require('./lib/qt-bridge/napi-loader.js');
          // env: {} keeps DSH_QT_NAPI_PATH from the previous step out of the way,
          // so only the <root>/<package>/prebuild/<triple>/ rule can succeed.
          const loaded = loader.loadNapiModule({ searchRoots: [process.cwd()], env: {} });
          if (!loaded || loaded.degraded || !loaded.bridge) {
            console.error('addon not discovered by search root:', JSON.stringify(loaded && loaded.source));
            process.exit(1);
          }
          console.log('discovered via', loaded.source, '(search root)');
          JS

      - name: Full suite with the real addon present
        env:
          DSH_QT_NAPI_PATH: ${{ github.workspace }}/dsh-qt-napi/prebuild/linux-x64/qt-bridge.node
        run: node scripts/gate.mjs -- pnpm test

  qml-lint:
    name: qml lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Qt Quick Controls 2 ships with qtdeclarative in Qt 6, so no extra
          # module is requested here (a Qt 5 style "qtquickcontrols2" module
          # would fail to resolve for 6.x).
          cache: true

      - name: qmllint qml/
        run: |
          find qml -name '*.qml' -print0 | xargs -0 -r qmllint

      - name: Configure (CMake, checks Qt6 requirements resolve)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

  # ---------------------------------------------------------------------------
  # qml tests: every TestCase under tests/qml/, executed headless.
  #
  # `qmltestrunner -input <dir> -import <dir>` discovers every tst_*.qml in the
  # directory, so a new suite is picked up without editing this file. The
  # "Assert every suite ran" step is what keeps that convenient behaviour honest:
  # a suite that fails to load can be silently skipped, so the number of executed
  # suites is compared against the number of tst_*.qml files on disk.
  # ---------------------------------------------------------------------------
  qml-tests:
    name: qml tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # Qt Quick Test drives the QML components headless through the offscreen
      # platform plugin; without it the runner needs a real display.
      - name: Install runtime libraries for the offscreen platform
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1

      - name: Count expected suites
        id: expected
        run: |
          count=$(ls tests/qml/tst_*.qml | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Expecting $count QML suites:"
          ls -1 tests/qml/tst_*.qml

      - name: Run Qt Quick Test suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          qmltestrunner -input tests/qml -import qml 2>&1 | tee qmltest.log

      # A suite whose imports fail is reported as an error by qmltestrunner but
      # the process can still exit 0 on some Qt versions, so both the exit code
      # (via pipefail above) and the executed-suite count are checked here.
      - name: Assert every suite ran
        run: |
          # One runner banner covers all suites. Count completed named suites,
          # not banners; require both lifecycle markers for every source suite.
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('qmltest.log').read_text()
          for suite in pathlib.Path('tests/qml').glob('tst_*.qml'):
              name = re.search(r'\bname:\s*"([^"]+)"', suite.read_text())
              assert name, f'{suite}: missing TestCase name'
              for phase in ('initTestCase', 'cleanupTestCase'):
                  marker = f'qmltestrunner::{name[1]}::{phase}()'
                  assert any(line.startswith('PASS ') and marker in line for line in log.splitlines()), marker
          PY
          executed=$(grep -cE '^PASS .*::cleanupTestCase\(\)' qmltest.log || true)
          expected="${{ steps.expected.outputs.count }}"
          echo "executed=$executed expected=$expected"
          if [ "$executed" -lt "$expected" ]; then
            echo "::error::only $executed of $expected QML suites executed — see qmltest.log"
            exit 1
          fi

      - name: Fail if any suite reported failures
        run: |
          # QtTest summarises each suite as
          #   Totals: 12 passed, 0 failed, 0 skipped, 0 blacklisted, 5ms
          # and there is no "Failures: N | Errors: N" line — checking for one
          # would make this step silently inert.
          failed_lines=$(grep -E '^Totals: [0-9]+ passed, [1-9][0-9]* failed' qmltest.log || true)
          if [ -n "$failed_lines" ]; then
            echo "::error::at least one QML suite reported failures"
            echo "$failed_lines"
            grep -E '^FAIL!' qmltest.log || true
            exit 1
          fi
          if ! grep -qE '^Totals: ' qmltest.log; then
            echo "::error::qmltestrunner produced no Totals line — see qmltest.log"
            exit 1
          fi

      - name: Upload QML test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmltest-log
          path: qmltest.log
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # qt-webengine: compile the WebEngine branch and prove it really loads.
  #
  # The mandatory Qt jobs above use the default Qt install, which does not ship
  # QtWebEngine. That means `#if DSH_QT_HAS_WEBENGINE` was never compiled, and
  # the embedded WebUI path (open → token → Chromium load → close) had no CI
  # evidence. This job is that evidence: it requests the qtwebengine module,
  # configures with -DDSH_QT_WEBENGINE=ON, asserts the compile-time flag really
  # is 1, then runs the real Chromium e2e (tests/webengine-chromium.e2e.ts)
  # against a local HTTP server.
  #
  # Chromium inside a container needs --no-sandbox and no GPU. The embedded
  # webview test runs on the offscreen platform; the external-browser test
  # needs a real QPlatformServices, so it starts Xvfb and runs the shipped
  # binary on xcb inside an isolated desktop profile. These flags are accepted
  # upstream for CI only — the shipped app never adds them.
  # ---------------------------------------------------------------------------
  qt-webengine:
    name: qt webengine (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Qt with the WebEngine module
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebengine
          cache: true

      # QtWebEngine links a real Chromium: the runner needs the shared
      # libraries Chromium itself expects, plus fonts for a page title to be
      # laid out. install-qt-action does not install these.
      - name: Install Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6             libasound2 libgbm1 libxshmfence1 libpulse0 libxkbcommon-x11-0             libxkbfile1 libxcb-cursor0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0             fonts-dejavu-core xvfb procps

      - name: Build TypeScript
        run: pnpm build

      - name: Configure with WebEngine ON
        run: |
          set -o pipefail
          cmake -S . -B build-webengine \
            -DDSH_QT_WEBENGINE=ON \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure-webengine.log

      # Two independent assertions: CMake found the module (so the flag cannot
      # silently be 0) and the compiled target really carries the definition.
      - name: Assert the WebEngine branch is compiled in
        run: |
          set -euo pipefail
          if ! grep -q 'Qt WebEngine embedding enabled' configure-webengine.log; then
            echo '::error::CMake did not enable Qt WebEngine — the module is missing'
            grep -i 'webengine' configure-webengine.log || true
            exit 1
          fi
          if ! grep -R -- '-DDSH_QT_HAS_WEBENGINE=1' build-webengine/CMakeFiles/dsh-qt-app.dir/flags.make; then
            echo '::error::the dsh-qt-app target does not compile with DSH_QT_HAS_WEBENGINE=1'
            exit 1
          fi
          test -x build-webengine/dsh-qt-app

      - name: Build
        run: cmake --build build-webengine --parallel 2

      # The external-browser half needs a browser that is not QtWebEngine.
      - name: Install Chrome for the external-browser e2e
        uses: browser-actions/setup-chrome@v1

      - name: Real Chromium auth load/close and external browser e2e
        env:
          DSH_QT_APP_BINARY: ${{ github.workspace }}/build-webengine/dsh-qt-app
          DSH_E2E_BROWSER: google-chrome
        run: pnpm exec tsx --test tests/webengine-chromium.e2e.ts

      - name: Upload WebEngine e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webengine-e2e
          path: configure-webengine.log
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # packaging: prove `pnpm package` produces an installable artifact.
  #
  # This runs in the test workflow as well as the build workflow because it is a
  # cheap correctness check on CMakeLists.txt (install rules + CPack generators),
  # whereas build.yml packages the real cross-platform release artifacts.
  # ---------------------------------------------------------------------------
  packaging:
    name: packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build TypeScript
        run: pnpm build

      - name: Package
        run: pnpm package

      - name: Assert an artifact exists
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/package/*.tar.gz dist/package/*.zip dist/package/*.dmg dist/package/*.exe)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::pnpm package produced no artifact in dist/package/"
            ls -la dist/package 2>/dev/null || true
            exit 1
          fi
          ls -la "${artifacts[@]}"


      # The package is only trustworthy if its license material survived
      # archiving. This is the Linux leg; Windows NSIS/ZIP is covered by the
      # packaging matrix (the local TGZ acceptance test is tests/packaging.test.ts).
      - name: Assert archive ships LICENSE + notices + SHA-256
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls dist/package/*.tar.gz | head -1)
          (cd dist/package && sha256sum -c "$(basename "$archive").sha256")
          root=$(tar -tzf "$archive" | head -1 | cut -d/ -f1)
          for required in LICENSE THIRD-PARTY-NOTICES.md; do
            if ! tar -tzf "$archive" | grep -qx "$root/$required"; then
              echo "::error::$archive is missing $required at its root"
              tar -tzf "$archive" | head -20
              exit 1
            fi
          done
          echo "archive root $root carries LICENSE and THIRD-PARTY-NOTICES.md"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-qt-app-package-${{ runner.os }}-${{ runner.arch }}
          path: dist/package/
          if-no-files-found: error
          retention-days: 7
