# Run the TypeScript typecheck, the unit tests, the QML lint, the Qt Quick Test
# suites and the dsh-qt-napi addon build.
#
# All test execution happens here — never on the development machine.
# The workflow assumes the repository root is dsh-qt-app/ (see docs/ci.md).
name: test

on:
  push:
    branches: [main, dev/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.7.3
  NODE_VERSION: "22.19.0"
  # The Markdown/GFM parser lives in its own repository; the addon job checks it
  # out as a sibling directory and the Qt jobs consume its prebuild artifact.
  NAPI_REPO: lbn2011/dsh-qt-napi
  # Full commit, not a branch: the addon is a separate repository and an
  # unpinned checkout would let a rebuilt cmark-gfm change this app silently.
  NAPI_SHA: 87084a6901297a4fe9af997d4b8cdf9d829b0f67

jobs:
  # ---------------------------------------------------------------------------
  # dsh-qt-napi: compile the cmark-gfm N-API addon from source.
  #
  # This is what proves the "cmark-gfm 0.30+" criterion in CI: the addon vendors
  # cmark-gfm and compiles it into qt-bridge.node. The Qt host never links cmark
  # itself (it talks to Node over the stdio bridge and receives an AST), so the
  # addon build is the only place cmark is compiled — and therefore the job that
  # has to stay green for Markdown rendering to work at all.
  # ---------------------------------------------------------------------------
  napi:
    name: napi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS is intentionally absent: the shared macOS runner pool is an
        # accepted gap for this project (see docs/ci.md § Known gaps).
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout dsh-qt-napi
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NAPI_REPO }}
          ref: ${{ env.NAPI_SHA }}
          path: dsh-qt-napi


      - name: Assert addon checkout matches the pinned SHA
        shell: bash
        working-directory: dsh-qt-napi
        run: |
          got="$(git rev-parse HEAD)"
          if [ "$got" != "$NAPI_SHA" ]; then
            echo "::error::dsh-qt-napi checkout is $got, expected pinned $NAPI_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --ignore-scripts keeps the install hook from compiling before the
      # explicit build step, so a compile failure is reported against "Build"
      # rather than buried inside dependency installation.
      - name: Install addon dependencies
        working-directory: dsh-qt-napi
        run: npm install --ignore-scripts

      # node-gyp is invoked through the node binary instead of through
      # scripts/build.mjs. That script resolves node-gyp to a local
      # node_modules/.bin shim and otherwise falls back to `npx` — on Windows both
      # are `.cmd` files, and spawning a `.cmd` without a shell throws EINVAL on
      # Node >= 18.20 / 20.12 (the CVE-2024-27980 hardening). Pinning the Node
      # version does not undo that, so the JS entry point is called directly and
      # the toolchain version is pinned here instead. scripts/build.mjs remains
      # what local builds use; the two steps below reproduce it for CI.
      - name: Install pinned node-gyp
        working-directory: dsh-qt-napi
        # --ignore-scripts matters: without it npm would also run this package's
        # own install hook, which compiles through the very shim we are avoiding.
        run: npm install --no-save --ignore-scripts node-gyp@11

      - name: Build addon (compiles vendored cmark-gfm)
        working-directory: dsh-qt-napi
        run: node node_modules/node-gyp/bin/node-gyp.js rebuild

      # Mirrors the staging half of scripts/build.mjs: the loader and the uploaded
      # artifact both expect prebuild/<platform>-<arch>/qt-bridge.node. Kept as a
      # node one-liner so it behaves identically in bash and in PowerShell.
      - name: Stage prebuild binary
        working-directory: dsh-qt-napi
        run: |
          node -e "const{existsSync,mkdirSync,copyFileSync}=require('node:fs');const t=process.platform+'-'+process.arch;const src='build/Release/qt-bridge.node';if(!existsSync(src)){console.error('missing '+src);process.exit(1)}mkdirSync('prebuild/'+t,{recursive:true});copyFileSync(src,'prebuild/'+t+'/qt-bridge.node');console.log('staged prebuild/'+t+'/qt-bridge.node')"

      - name: Verify addon
        working-directory: dsh-qt-napi
        run: npm run verify

      # The addon's loader-integration suite drives the *host* loader
      # (dsh-qt-app/lib/qt-bridge/napi-loader.js) against this package, and resolves
      # the host as a sibling directory literally named dsh-qt-app. Without a
      # compiled host present, that suite fails with 'run "pnpm -C dsh-qt-app build"
      # first', so the host is checked out and built here as well.
      - name: Checkout dsh-qt-app (host loader under test)
        uses: actions/checkout@v4
        with:
          path: dsh-qt-app

      # This job's workspace root is the addon checkout, which has no package.json,
      # so pnpm/action-setup cannot infer the version from the default location;
      # point it at the host's manifest to keep packageManager the single source.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: dsh-qt-app/package.json

      - name: Build host TypeScript package
        run: pnpm -C dsh-qt-app install --frozen-lockfile && pnpm -C dsh-qt-app build

      - name: Addon unit tests
        working-directory: dsh-qt-napi
        run: npm test

      # The loader in src/qt-bridge/napi-loader.ts discovers the addon through
      # prebuild/<platform>-<arch>/, which is exactly what gets uploaded here.
      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-${{ runner.os }}-${{ runner.arch }}
          path: dsh-qt-napi/prebuild/
          if-no-files-found: error
          retention-days: 7

  typescript:
    name: typescript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm version comes from "packageManager" in package.json; passing an
      # explicit `version:` as well makes action-setup fail.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Assert pinned addon SHA (package.json)
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const want=process.env.NAPI_SHA; const got=p.dshQtNapi&&p.dshQtNapi.commit; if(got!==want){console.error('addon SHA lock mismatch: package.json='+got+' env='+want);process.exit(1)} console.log('addon SHA lock ok: '+got)"

      # The staging rules decide which prebuild directory travels inside the
      # package, so they run on every OS. Script mode: no Qt, no compiler, and the
      # fixtures are four-byte files carrying real object-format magic.
      # The legacy run is the negative control — the baseline 5671824 algorithm
      # must still fail the case table, or the table has stopped detecting T29-A.
      - name: Assert the addon staging rules pick the target triple
        shell: bash
        run: |
          cmake -DMODE=resolver -DDSH_QT_NAPI_TEST_ROOT=build/napi-fixtures-resolver \
            -P tests/cmake/napi-addon-resolution.cmake
          if cmake -DMODE=legacy -DDSH_QT_NAPI_TEST_ROOT=build/napi-fixtures-legacy \
              -P tests/cmake/napi-addon-resolution.cmake; then
            echo "::error::the baseline staging algorithm no longer fails the case table"
            exit 1
          fi
          echo "baseline staging algorithm still fails the table, as expected"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src + tests)
        run: node scripts/gate.mjs -- pnpm typecheck

      - name: Unit tests
        run: node scripts/gate.mjs -- pnpm test

  # ---------------------------------------------------------------------------
  # webui real host: the two host-dependent WebUI tests need an installed DSH
  # tree, which the unit job deliberately does not provide (it skips them and
  # the skip is counted, not silently ignored). This gate prepares the pinned
  # release and sets DSH_REQUIRE_REAL_HOST=1, so a missing host fails instead of
  # skipping. The test itself still isolates DSH_HOME.
  # ---------------------------------------------------------------------------
  webui-real-host:
    # A fixed display name on purpose: `jobs.<job_id>.name` can only read the
    # github/inputs/matrix/needs/strategy/vars contexts, so an `env` expression
    # here makes GitHub reject the whole workflow file before any job is
    # created. The pinned host version stays in the single `env` block below,
    # which is where the job's steps read it from.
    name: webui real host (pinned dsh host)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DSH_HOST_VERSION: 0.2.2-rc.1
      DSH_REQUIRE_REAL_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned official DSH host
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-host" "@deepseek-ai/dsh@$DSH_HOST_VERSION"
          "$RUNNER_TEMP/dsh-host/node_modules/.bin/dsh" --version
      - name: Real host WebUI tests
        env:
          DSH_HOST_ROOT: ${{ runner.temp }}/dsh-host/node_modules
        run: |
          # pipefail keeps the suite's exit code: through `| tee` alone a failing
          # test command exits 0 and the step would be a false green.
          set -euo pipefail
          export PATH="$RUNNER_TEMP/dsh-host/node_modules/.bin:$PATH"
          pnpm exec tsx --test --test-timeout=120000 tests/webui-default-off.test.ts 2>&1 | tee webui-real-host.log
      - name: Fail if a host test was skipped
        run: |
          # Node prints its spec summary ("ℹ skipped 0") only when stdout is a TTY;
          # through the tee pipe it prints the TAP summary ("# skipped 0"), so the
          # old assertion could never pass. Accept either form, and require the
          # real pass count as well so an empty or truncated log cannot read as
          # success.
          set -euo pipefail
          for expected in 'pass 3' 'fail 0' 'skipped 0'; do
            if ! grep -Eq "^(#|ℹ) ${expected}\$" webui-real-host.log; then
              echo "::error::the real host suite did not report '${expected}'"
              cat webui-real-host.log
              exit 1
            fi
          done
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-real-host-log
          path: webui-real-host.log
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # napi integration: run the TypeScript suite with a real addon on disk.
  #
  # The unit suite is hermetic (it must pass on a machine without the addon), so
  # it cannot prove the napi-loader discovery path works against a real binary.
  # This job downloads the prebuild and asserts the loader finds and uses it.
  # ---------------------------------------------------------------------------
  napi-integration:
    name: napi integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: napi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download addon prebuild
        uses: actions/download-artifact@v4
        with:
          name: napi-prebuild-Linux-X64
          path: dsh-qt-napi/prebuild

      - name: Build TypeScript
        run: pnpm build

      # Two discovery paths matter and both are checked here, because they fail
      # independently: an explicit DSH_QT_NAPI_PATH (what CI sets) and the
      # search-root rule `<root>/dsh-qt-napi/prebuild/<triple>/`, which is how a
      # packaged app finds the addon with no environment help at all.
      - name: Addon is discovered via DSH_QT_NAPI_PATH
        env:
          DSH_QT_NAPI_PATH: ${{ github.workspace }}/dsh-qt-napi/prebuild/linux-x64/qt-bridge.node
        run: |
          node --input-type=commonjs - <<'JS'
          const loader = require('./lib/qt-bridge/napi-loader.js');
          const loaded = loader.loadNapiModule({ searchRoots: [] , env: process.env });
          if (!loaded || loaded.degraded || !loaded.bridge) {
            console.error('addon not discovered via env:', JSON.stringify(loaded && loaded.source));
            process.exit(1);
          }
          if (loaded.source !== 'env') {
            console.error('expected source "env", got', loaded.source);
            process.exit(1);
          }
          console.log('discovered via', loaded.source);
          JS

      - name: Addon is discovered by search root (packaged-app layout)
        run: |
          node --input-type=commonjs - <<'JS'
          const loader = require('./lib/qt-bridge/napi-loader.js');
          // env: {} keeps DSH_QT_NAPI_PATH from the previous step out of the way,
          // so only the <root>/<package>/prebuild/<triple>/ rule can succeed.
          const loaded = loader.loadNapiModule({ searchRoots: [process.cwd()], env: {} });
          if (!loaded || loaded.degraded || !loaded.bridge) {
            console.error('addon not discovered by search root:', JSON.stringify(loaded && loaded.source));
            process.exit(1);
          }
          console.log('discovered via', loaded.source, '(search root)');
          JS

      - name: Full suite with the real addon present
        env:
          DSH_QT_NAPI_PATH: ${{ github.workspace }}/dsh-qt-napi/prebuild/linux-x64/qt-bridge.node
        run: node scripts/gate.mjs -- pnpm test

  qml-lint:
    name: qml lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Qt Quick Controls 2 ships with qtdeclarative in Qt 6, so no extra
          # module is requested here (a Qt 5 style "qtquickcontrols2" module
          # would fail to resolve for 6.x).
          cache: true

      - name: qmllint qml/
        run: |
          find qml -name '*.qml' -print0 | xargs -0 -r qmllint

      - name: Configure (CMake, checks Qt6 requirements resolve)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

  # ---------------------------------------------------------------------------
  # qml tests: every TestCase under tests/qml/, executed headless.
  #
  # `qmltestrunner -input <dir> -import <dir>` discovers every tst_*.qml in the
  # directory, so a new suite is picked up without editing this file. The
  # "Assert every suite ran" step is what keeps that convenient behaviour honest:
  # a suite that fails to load can be silently skipped, so the number of executed
  # suites is compared against the number of tst_*.qml files on disk.
  # ---------------------------------------------------------------------------
  qml-tests:
    name: qml tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # Qt Quick Test drives the QML components headless through the offscreen
      # platform plugin; without it the runner needs a real display.
      - name: Install runtime libraries for the offscreen platform
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1

      - name: Count expected suites
        id: expected
        run: |
          count=$(ls tests/qml/tst_*.qml | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Expecting $count QML suites:"
          ls -1 tests/qml/tst_*.qml

      - name: Run Qt Quick Test suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          qmltestrunner -input tests/qml -import qml 2>&1 | tee qmltest.log

      # A suite whose imports fail is reported as an error by qmltestrunner but
      # the process can still exit 0 on some Qt versions, so both the exit code
      # (via pipefail above) and the executed-suite count are checked here.
      - name: Assert every suite ran
        run: |
          # One runner banner covers all suites. Count completed named suites,
          # not banners; require both lifecycle markers for every source suite.
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('qmltest.log').read_text()
          for suite in pathlib.Path('tests/qml').glob('tst_*.qml'):
              name = re.search(r'\bname:\s*"([^"]+)"', suite.read_text())
              assert name, f'{suite}: missing TestCase name'
              for phase in ('initTestCase', 'cleanupTestCase'):
                  marker = f'qmltestrunner::{name[1]}::{phase}()'
                  assert any(line.startswith('PASS ') and marker in line for line in log.splitlines()), marker
          PY
          executed=$(grep -cE '^PASS .*::cleanupTestCase\(\)' qmltest.log || true)
          expected="${{ steps.expected.outputs.count }}"
          echo "executed=$executed expected=$expected"
          if [ "$executed" -lt "$expected" ]; then
            echo "::error::only $executed of $expected QML suites executed — see qmltest.log"
            exit 1
          fi

      - name: Fail if any suite reported failures
        run: |
          # QtTest summarises each suite as
          #   Totals: 12 passed, 0 failed, 0 skipped, 0 blacklisted, 5ms
          # and there is no "Failures: N | Errors: N" line — checking for one
          # would make this step silently inert.
          failed_lines=$(grep -E '^Totals: [0-9]+ passed, [1-9][0-9]* failed' qmltest.log || true)
          if [ -n "$failed_lines" ]; then
            echo "::error::at least one QML suite reported failures"
            echo "$failed_lines"
            grep -E '^FAIL!' qmltest.log || true
            exit 1
          fi
          if ! grep -qE '^Totals: ' qmltest.log; then
            echo "::error::qmltestrunner produced no Totals line — see qmltest.log"
            exit 1
          fi

      - name: Upload QML test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmltest-log
          path: qmltest.log
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # qt-gui-heartbeat: prove the GUI thread keeps running while stdin is idle.
  #
  # T93-1: the Windows read loop called ::_read from a 25 ms timer. On Windows
  # that call blocks on an idle anonymous pipe, so the GUI thread parked, every
  # QTimer stopped (including the 5 s handshake deadline) and the process stayed
  # alive with no window and no log line. The Linux build reads through
  # QSocketNotifier, which is why the suite never caught it.
  #
  # The test asks the binary for a heartbeat: a 50 ms QTimer on the GUI thread
  # appends `hb <seq> <elapsed> <windows> <exposed> <visible>` to
  # DSH_QT_HEARTBEAT_FILE. The test then holds stdin open and silent and
  # requires the ticks to keep coming, with a real QWindow created and exposed.
  # Its second case sets DSH_QT_STDIO_TEST_LEGACY_READ=1, which reproduces the
  # pre-fix read shape inside the same binary, and requires that same heartbeat
  # to stall — the red side of the regression, so this cannot pass by only
  # checking that the process is alive.
  #
  # Both hosted runners run it on purpose: Windows is where the defect lives,
  # Linux is where the fixed read path must stay identical. The Windows runner
  # has no physical display; if window exposure turns out to be unavailable
  # there, set DSH_QT_EXPECT_NO_DESKTOP=1 on that job and record the exposure
  # gap in the test record — never drop the heartbeat assertion instead.
  # ---------------------------------------------------------------------------
  qt-gui-heartbeat:
    name: qt gui heartbeat (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # The xcb/GL libraries are what the Qt Quick window and the offscreen
      # platform plugin link against; install-qt-action does not install them.
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

      - name: Build TypeScript
        run: pnpm build

      # -DCMAKE_BUILD_TYPE only drives single-config generators (Makefiles/Ninja on
      # Linux). MSVC is a multi-config generator: it ignores the cache variable and
      # writes to a per-configuration directory, so the configuration has to be
      # chosen on the build command as well.
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDSH_QT_WEBENGINE=OFF

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --config Release --parallel 2
          else
            cmake --build build --parallel 2
          fi

      # MSVC is a multi-config generator: this run's executable is the one under
      # build/Release. Resolve it once here so the test step cannot silently skip
      # itself on a path that does not exist (the e2e skips when the binary is
      # missing), and fail loudly instead of falling back to a Debug build.
      - name: Resolve the binary under test
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            candidate="build/Release/dsh-qt-app.exe"
          else
            candidate="build/dsh-qt-app"
          fi
          if [ ! -f "$candidate" ]; then
            echo "::error::the Release binary was not produced at $candidate; build/ contains:"
            ls -R build | head -80 || true
            exit 1
          fi
          # Echo the path so a failure and a pass both say which file was used.
          # DSH_QT_APP_BINARY stays rooted at GITHUB_WORKSPACE: Git Bash would
          # print a /d/a/... MSYS path that native Node on Windows cannot open.
          echo "binary under test: $GITHUB_WORKSPACE/$candidate"
          echo "DSH_QT_APP_BINARY=$GITHUB_WORKSPACE/$candidate" >> "$GITHUB_ENV"

      - name: Run the GUI heartbeat regression
        shell: bash
        env:
          # A hosted Windows runner has no interactive desktop, so a window is
          # created and shown but never exposed. Asserting exposure there would
          # be false; the job summary records that it was not asserted. Linux runs
          # under the offscreen QPA, which does report exposure, so it asserts it.
          DSH_QT_EXPECT_NO_DESKTOP: ${{ matrix.os == 'windows-2022' && '1' || '0' }}
          # The suite copies both heartbeat channels and a JSON summary here on
          # exit; a failed run is then diagnosable from the artifact alone.
          DSH_QT_HB_ARTIFACT_DIR: ${{ github.workspace }}/gui-heartbeat-samples
        run: |
          set -o pipefail
          pnpm exec tsx --test tests/gui-heartbeat.e2e.ts 2>&1 | tee gui-heartbeat.log

      # A skip would leave the log green without a single assertion, so the
      # summary is checked as well as the exit code.
      - name: Assert the regression really ran
        shell: bash
        run: |
          set -euo pipefail
          log=gui-heartbeat.log
          if [ ! -f "$log" ]; then
            echo '::error::gui-heartbeat.log was not produced'
            exit 1
          fi
          # Read the log through one normalisation pass, so every check below has
          # a single spelling to match instead of each guessing the reporter's
          # dialect:
          #
          #   - `tr -d '\r'`: a log written or carried through Windows keeps a
          #     CRLF tail, which leaves `$3` as `17\r`; no numeric test accepts
          #     that, so a legitimate green run was rejected.
          #   - `# \# ` -> `# `: when its output is a pipe — here it goes through
          #     `tee` — Node's TAP reporter escapes the leading `#` of a
          #     diagnostic line, so the suite's own `# stages ...` and
          #     `# park: ...` arrive as `# \# stages ...`. That is the same
          #     line, and matching only the unescaped form rejected a real 17/17
          #     run on Node 22.19, the version actions/setup-node installs.
          #
          # One backslash, never two: this step is shell inside YAML, but the
          # same text is also handed to a shell as one command-line argument
          # (that is what the gate's own test file does). On Windows the
          # argument goes through an MSYS command line, which collapses `\\`
          # into `\`, so a `sed 's/^# \\# /# /'` arrives as a pattern matching a
          # literal `# # ` and never fires — a real TAP log was then rejected on
          # the Windows runner while every synthetic log still passed. The escape
          # is therefore built from the character code instead of written out.
          #
          # The test step is deliberately not pinned to `--test-reporter=spec`:
          # accepting either dialect here keeps the gate independent of it.
          normalized=$(mktemp)
          trap 'rm -f "$normalized"' EXIT
          tr -d '\r' < "$log" | awk '
            BEGIN { backslash = sprintf("%c", 92); escaped = "# " backslash "# " }
            {
              if (substr($0, 1, length(escaped)) == escaped) print "# " substr($0, length(escaped) + 1)
              else print $0
            }
          ' > "$normalized"

          # Node's test reporter prints exactly one summary block, each count on
          # its own line as `ℹ <field> <number>`. Unanchored greps cannot read it
          # correctly: `pass 17` also matches `pass 170`, and `fail 0` says
          # nothing about a `cancelled 1` sitting next to it, so a run that
          # cancelled a case and a run ten times the expected size both looked
          # green. Parse whole lines into field/value pairs instead.
          #
          # The decoration is not stripped by character class: `ℹ` is
          # U+2139 INFORMATION SOURCE, a *letter* in Unicode, so in a UTF-8
          # locale it survives `s/^[^[:alnum:]]*//` and the match fails. Split on
          # whitespace and compare the field name instead, which behaves the same
          # in every locale and in Git Bash on Windows.
          fields=$(awk '
            {
              if (NF == 3 && $3 ~ /^[0-9]+$/ && $2 ~ /^(tests|pass|fail|cancelled|skipped)$/) print $2, $3
              else if (NF == 2 && $2 ~ /^[0-9]+$/ && $1 ~ /^(tests|pass|fail|cancelled|skipped)$/) print $1, $2
            }
          ' "$normalized")

          field_value() {
            field=$1
            occurrences=$(printf '%s\n' "$fields" | awk -v f="$field" '$1 == f' | wc -l | tr -d ' ')
            if [ "$occurrences" -ne 1 ]; then
              echo "::error::gui-heartbeat.log carries $occurrences '$field' summary lines; one run reports one summary"
              tail -60 "$log"
              return 1
            fi
            printf '%s\n' "$fields" | awk -v f="$field" '$1 == f {print $2}'
          }

          tests=$(field_value tests) || exit 1
          pass=$(field_value pass) || exit 1
          fail=$(field_value fail) || exit 1
          cancelled=$(field_value cancelled) || exit 1
          skipped=$(field_value skipped) || exit 1

          # A summary whose parts do not add up to its total is not evidence.
          accounted=$((pass + fail + cancelled + skipped))
          if [ "$accounted" -ne "$tests" ]; then
            echo "::error::gui-heartbeat summary contradicts itself: tests $tests, but pass $pass + fail $fail + cancelled $cancelled + skipped $skipped = $accounted"
            tail -60 "$log"
            exit 1
          fi
          if [ "$tests" -ne 17 ] || [ "$pass" -ne 17 ] || [ "$fail" -ne 0 ] || [ "$cancelled" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "::error::expected 17 passing cases and nothing else; got tests $tests, pass $pass, fail $fail, cancelled $cancelled, skipped $skipped"
            tail -60 "$log"
            exit 1
          fi
          if grep -q '# SKIP' "$normalized"; then
            echo '::error::a GUI heartbeat case skipped itself — see gui-heartbeat.log'
            exit 1
          fi
          # The measured start-up legs and the parked-GUI control are printed as
          # `# stages <label>: {...}` and `# park: ...`. They are the evidence that
          # the suite separated start-up, observation channel and steady state, so
          # a run without them is not the run this job claims to have made. These
          # read the normalised copy: under Node's TAP reporter they arrive as
          # `# \# stages ...`, which is the same line once unescaped.
          if ! grep -qE '^# stages ' "$normalized"; then
            echo '::error::gui-heartbeat.log carries no measured start-up stages'
            tail -60 "$log"
            exit 1
          fi
          if ! grep -qE '^# park: ' "$normalized"; then
            echo '::error::gui-heartbeat.log carries no parked-GUI negative control record'
            tail -60 "$log"
            exit 1
          fi

      # Item G of the review: when the runner has no visible desktop the
      # exposure assertion is downgraded, so say so in the job summary instead of
      # letting a green job imply a first window was observed.
      - name: Record whether window exposure was asserted
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'window exposure is not asserted here' gui-heartbeat.log; then
            {
              echo '### Window exposure: NOT asserted on this runner'
              echo
              echo 'The GUI-thread heartbeat was asserted; no visible desktop was available,'
              echo 'so this job claims no first-window observation.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Window exposure: asserted'
              echo
              echo 'A top-level window was created and exposed while stdin was idle.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the GUI heartbeat log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-heartbeat-log-${{ matrix.os }}
          path: |
            gui-heartbeat.log
            gui-heartbeat-samples/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # qt-webengine: compile the WebEngine branch and prove it really loads.
  #
  # The mandatory Qt jobs above use the default Qt install, which does not ship
  # QtWebEngine. That means `#if DSH_QT_HAS_WEBENGINE` was never compiled, and
  # the embedded WebUI path (open → token → Chromium load → close) had no CI
  # evidence. This job is intended to produce that evidence; it has not yet
  # been executed on a hosted runner, so nothing here asserts a remote pass.
  # It requests the qtwebengine module, configures with -DDSH_QT_WEBENGINE=ON, asserts the compile-time flag really
  # is 1, then runs the real Chromium e2e (tests/webengine-chromium.e2e.ts)
  # against a local HTTP server.
  #
  # Chromium inside a container needs --no-sandbox and no GPU. The embedded
  # webview test runs on the offscreen platform; the external-browser test
  # needs a real QPlatformServices, so it starts Xvfb and runs the shipped
  # binary on xcb inside an isolated desktop profile. These flags are accepted
  # upstream for CI only — the shipped app never adds them.
  # ---------------------------------------------------------------------------
  qt-webengine:
    name: qt webengine (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Qt with the WebEngine module
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # QtWebEngineQuick's CMake package needs two sibling module archives,
          # not one: Qt6::WebChannelQuick (qtwebchannel) and Qt6::Positioning
          # (qtpositioning). aqt does not follow the addon's own dependencies, so
          # `qtwebengine` alone (T29-3) and `qtwebengine qtwebchannel` (T44-3)
          # both still left find_dependency(Positioning) failing, which made the
          # optional component silently absent. All three modules must be named.
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      # QtWebEngine links a real Chromium: the runner needs the shared
      # libraries Chromium itself expects, plus fonts for a page title to be
      # laid out. install-qt-action does not install these.
      - name: Install Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6             libasound2 libgbm1 libxshmfence1 libpulse0 libxkbcommon-x11-0             libxkbfile1 libxcb-cursor0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0             fonts-dejavu-core xvfb procps

      - name: Build TypeScript
        run: pnpm build

      # install-qt-action exits 0 even when a module archive is missing one of the
      # CMake packages the configure step needs, and the product then degrades
      # silently. Assert the three packages on disk first, so a missing module
      # fails here with its path (T44-3).
      - name: Assert the WebEngine CMake packages are installed
        run: |
          set -euo pipefail
          for package in Qt6WebEngineQuick Qt6WebChannelQuick Qt6Positioning; do
            if [ ! -d "$QT_ROOT_DIR/lib/cmake/$package" ]; then
              echo "::error::$QT_ROOT_DIR/lib/cmake/$package is missing (install-qt modules: qtwebengine qtwebchannel qtpositioning)"
              ls "$QT_ROOT_DIR/lib/cmake" | sort || true
              exit 1
            fi
          done

      - name: Configure with WebEngine ON
        run: |
          set -o pipefail
          cmake -S . -B build-webengine \
            -DDSH_QT_WEBENGINE=ON \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure-webengine.log

      # Two independent assertions that only need the configure output: CMake
      # found the module (so the flag cannot silently be 0) and the generated
      # target really carries the definition. The binary does not exist until
      # the build step below, so it is checked after the build (T48-2: asserting
      # it here failed the job before the e2e could run).
      - name: Assert the WebEngine branch is compiled in
        run: |
          set -euo pipefail
          if ! grep -q 'Qt WebEngine embedding enabled' configure-webengine.log; then
            echo '::error::CMake did not enable Qt WebEngine — the module is missing'
            grep -i 'webengine' configure-webengine.log || true
            exit 1
          fi
          if ! grep -R -- '-DDSH_QT_HAS_WEBENGINE=1' build-webengine/CMakeFiles/dsh-qt-app.dir/flags.make; then
            echo '::error::the dsh-qt-app target does not compile with DSH_QT_HAS_WEBENGINE=1'
            exit 1
          fi

      - name: Build
        run: cmake --build build-webengine --parallel 2

      # Now that the artifact exists, prove it is runnable and actually links the
      # WebEngine library the compile definition claims.
      - name: Assert the built binary links Qt WebEngine
        run: |
          set -euo pipefail
          test -x build-webengine/dsh-qt-app
          if ! ldd build-webengine/dsh-qt-app | grep -q 'libQt6WebEngineQuick'; then
            echo '::error::the built binary does not link Qt6WebEngineQuick'
            ldd build-webengine/dsh-qt-app | sort || true
            exit 1
          fi
          echo "webengine libraries linked: $(ldd build-webengine/dsh-qt-app | grep -c 'libQt6WebEngine')"

      # The external-browser half needs a browser that is not QtWebEngine.
      - name: Install Chrome for the external-browser e2e
        uses: browser-actions/setup-chrome@v1

      - name: Real Chromium auth load/close and external browser e2e
        env:
          DSH_QT_APP_BINARY: ${{ github.workspace }}/build-webengine/dsh-qt-app
          DSH_E2E_BROWSER: google-chrome
        run: |
          set -euo pipefail
          pnpm exec tsx --test tests/webengine-chromium.e2e.ts 2>&1 | tee webengine-e2e.log

      - name: Upload WebEngine e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webengine-e2e
          path: |
            configure-webengine.log
            webengine-e2e.log
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # packaging: prove `pnpm package` produces an installable artifact.
  #
  # This runs in the test workflow as well as the build workflow because it is a
  # cheap correctness check on CMakeLists.txt (install rules + CPack generators),
  # whereas build.yml packages the real cross-platform release artifacts.
  # ---------------------------------------------------------------------------
  packaging:
    name: packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build TypeScript
        run: pnpm build

      - name: Package
        run: pnpm package

      - name: Assert an artifact exists
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/package/*.tar.gz dist/package/*.zip dist/package/*.dmg dist/package/*.exe)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::pnpm package produced no artifact in dist/package/"
            ls -la dist/package 2>/dev/null || true
            exit 1
          fi
          ls -la "${artifacts[@]}"


      # The package is only trustworthy if its license material survived
      # archiving, and if the executable inside it is for the platform it claims.
      - name: Assert archive ships LICENSE + notices + SHA-256
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The check is also exercised locally by tests/packaging.test.ts.
          # It consumes the complete tar listing and preserves tar's exit code.
          mapfile -t archives < <(find dist/package -maxdepth 1 -name '*.tar.gz' -print)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .tar.gz in dist/package, found ${#archives[@]}"
            ls -l dist/package
            exit 1
          fi
          bash scripts/check-archive.sh "${archives[0]}"

      # Same contents check on the archive itself, on BOTH legs. check-archive.sh
      # only reads .tar.gz, so the Windows ZIP/NSIS package went unverified; this
      # step unpacks whatever CPack produced and inspects it. This job builds
      # without the addon on purpose (degraded renderer), and the gate enforces
      # exactly that: no dsh-qt-napi/ tree, LICENSE + notices present, and a host
      # executable whose object format matches the runner.
      - name: Assert the package contents match the platform
        shell: bash
        run: |
          triple="$(node -p "process.platform + '-' + process.arch")"
          archive=""
          for candidate in dist/package/*.tar.gz dist/package/*.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; break; fi
          done
          if [ -z "$archive" ]; then
            echo "::error::pnpm package produced no archive in dist/package/"
            exit 1
          fi
          rm -rf unpacked && mkdir -p unpacked
          case "$archive" in
            *.tar.gz) tar -xzf "$archive" -C unpacked ;;
            *.zip) 7z x -y -ounpacked "$archive" > /dev/null ;;
            *) echo "::error::unsupported archive type: $archive"; exit 1 ;;
          esac
          root="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -1)"
          node scripts/check-package-addon.mjs --dir "$root" --triple "$triple" --expect-addon degraded

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-qt-app-package-${{ runner.os }}-${{ runner.arch }}
          path: dist/package/
          if-no-files-found: error
          retention-days: 7
