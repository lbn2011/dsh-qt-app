# Build the Qt application and produce installable packages.
#
# Three things happen here that are worth knowing before editing:
#
# 1. The dsh-qt-napi addon is built in its own job, because it lives in a
#    separate repository (lbn2011/dsh-qt-napi) and compiles vendored cmark-gfm.
#    The Qt matrix consumes its prebuild artifact instead of compiling cmark
#    itself: the Qt executable never parses Markdown (Node does, and hands QML an
#    AST over the stdio bridge), so linking cmark-gfm here would duplicate
#    symbols and ship a parser that is never called.
#
# 2. DSH_QT_NAPI_DIR points the CMake install rules at that artifact so CPack
#    bundles qt-bridge.node next to the executable, in the
#    dsh-qt-napi/prebuild/<platform>-<arch>/ layout the loader expects.
#
# 3. `pnpm package` both compiles and packages (see CMakeLists.txt), so the
#    artifact upload is the real proof that install rules and CPack work.
#
# macOS is in the matrix but is an accepted gap: the shared macOS runner pool is
# unavailable to this project, so those legs are cancelled before step 1. See
# docs/ci.md § Known gaps.
name: build

on:
  push:
    branches: [main, dev/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.7.3
  NODE_VERSION: "22.19.0"
  NAPI_REPO: lbn2011/dsh-qt-napi
  # Full commit, not a branch: the addon is a separate repository and an
  # unpinned checkout would let a rebuilt cmark-gfm change this app silently.
  NAPI_SHA: 87084a6901297a4fe9af997d4b8cdf9d829b0f67

jobs:
  # ---------------------------------------------------------------------------
  # Build the Markdown addon (compiles vendored cmark-gfm) and publish its
  # prebuild/ tree as an artifact for the Qt matrix.
  # ---------------------------------------------------------------------------
  napi:
    name: napi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout dsh-qt-napi
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NAPI_REPO }}
          ref: ${{ env.NAPI_SHA }}
          path: dsh-qt-napi


      - name: Assert addon checkout matches the pinned SHA
        shell: bash
        working-directory: dsh-qt-napi
        run: |
          got="$(git rev-parse HEAD)"
          if [ "$got" != "$NAPI_SHA" ]; then
            echo "::error::dsh-qt-napi checkout is $got, expected pinned $NAPI_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install addon dependencies
        working-directory: dsh-qt-napi
        run: npm install --ignore-scripts

      # node-gyp is invoked through the node binary instead of through
      # scripts/build.mjs. That script resolves node-gyp to a local
      # node_modules/.bin shim and otherwise falls back to `npx` — on Windows both
      # are `.cmd` files, and spawning a `.cmd` without a shell throws EINVAL on
      # Node >= 18.20 / 20.12 (the CVE-2024-27980 hardening). Pinning the Node
      # version does not undo that, so the JS entry point is called directly and
      # the toolchain version is pinned here instead. scripts/build.mjs remains
      # what local builds use; the two steps below reproduce it for CI.
      - name: Install pinned node-gyp
        working-directory: dsh-qt-napi
        # --ignore-scripts matters: without it npm would also run this package's
        # own install hook, which compiles through the very shim we are avoiding.
        run: npm install --no-save --ignore-scripts node-gyp@11

      - name: Build addon (compiles vendored cmark-gfm)
        working-directory: dsh-qt-napi
        run: node node_modules/node-gyp/bin/node-gyp.js rebuild

      # Mirrors the staging half of scripts/build.mjs: the loader and the uploaded
      # artifact both expect prebuild/<platform>-<arch>/qt-bridge.node. Kept as a
      # node one-liner so it behaves identically in bash and in PowerShell.
      - name: Stage prebuild binary
        working-directory: dsh-qt-napi
        run: |
          node -e "const{existsSync,mkdirSync,copyFileSync}=require('node:fs');const t=process.platform+'-'+process.arch;const src='build/Release/qt-bridge.node';if(!existsSync(src)){console.error('missing '+src);process.exit(1)}mkdirSync('prebuild/'+t,{recursive:true});copyFileSync(src,'prebuild/'+t+'/qt-bridge.node');console.log('staged prebuild/'+t+'/qt-bridge.node')"

      - name: Verify addon
        working-directory: dsh-qt-napi
        run: npm run verify

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-${{ runner.os }}-${{ runner.arch }}
          path: dsh-qt-napi/prebuild/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Compile the Qt app, then package it.
  # ---------------------------------------------------------------------------
  qt-build:
    name: qt build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: napi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Assert pinned addon SHA (package.json)
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const want=process.env.NAPI_SHA; const got=p.dshQtNapi&&p.dshQtNapi.commit; if(got!==want){console.error('addon SHA lock mismatch: package.json='+got+' env='+want);process.exit(1)} console.log('addon SHA lock ok: '+got)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: node scripts/gate.mjs -- pnpm build

      # The JavaScript half of the app is a Cordis plugin. Package it from the
      # same compiled `lib/` tree the Qt executable embeds, then prove the tarball
      # is installable and mountable in a clean host closure. Linux only: the
      # plugin is platform-independent, and this keeps one authoritative
      # tarball instead of three copies with different mtimes.
      - name: Pack the JavaScript plugin
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/plugin
          mkdir -p dist/plugin
          npm pack --pack-destination dist/plugin --json > dist/plugin/pack.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'

          const dir = 'dist/plugin'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const packed = JSON.parse(readFileSync(`${dir}/pack.json`, 'utf8'))
          assert.equal(packed.length, 1, 'npm pack must describe exactly one tarball')
          const meta = packed[0]
          assert.equal(meta.name, pkg.name)
          assert.equal(meta.version, pkg.version)
          assert.equal(meta.filename, `${pkg.name.replace(/^@/, '').replace(/\//g, '-')}-${pkg.version}.tgz`)
          assert.equal(pkg.license, 'MIT')
          assert.equal(pkg.main, 'lib/index.js')
          assert.equal(pkg.types, 'lib/index.d.ts')
          assert.equal(pkg.exports['.'].default, './lib/index.js')
          assert.equal(pkg.exports['.'].types, './lib/index.d.ts')
          assert.equal(pkg.exports['./package.json'], './package.json')
          const packedFiles = new Set(meta.files.map((file) => `package/${file.path}`))
          for (const file of ['package/lib/index.js', 'package/lib/index.d.ts', 'package/LICENSE', 'package/THIRD-PARTY-NOTICES.md']) {
            assert.ok(packedFiles.has(file), `tarball is missing ${file}`)
          }

          const tarball = `${dir}/${meta.filename}`
          const bytes = readFileSync(tarball)
          const sha256 = createHash('sha256').update(bytes).digest('hex')
          writeFileSync(`${tarball}.sha256`, `${sha256}  ${meta.filename}\n`)

          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const workflowSha = process.env.GITHUB_SHA || ''
          if (workflowSha !== '' && workflowSha !== sourceSha)
            throw new Error(`workflow SHA ${workflowSha} does not describe checked-out source ${sourceSha}`)
          const provenance = {
            schemaVersion: 1,
            package: pkg.name,
            version: pkg.version,
            license: pkg.license,
            tarball: meta.filename,
            size: bytes.length,
            sha256,
            entry: pkg.main,
            types: pkg.types,
            addonSha: pkg.dshQtNapi?.commit ?? null,
            source: {
              repository: process.env.GITHUB_REPOSITORY || 'lbn2011/dsh-qt-app',
              workflow: process.env.GITHUB_WORKFLOW || 'build',
              workflowSha: workflowSha || null,
              sourceSha,
              sourceMatchesWorkflow: workflowSha === '' ? null : workflowSha === sourceSha,
              ref: process.env.GITHUB_REF_NAME || 'local',
              runId: process.env.GITHUB_RUN_ID || null,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT || null,
            },
            node: process.version,
            generatedAt: new Date().toISOString(),
            download: 'GitHub Actions artifact dsh-qt-app-plugin; no registry or permanent URL',
          }
          writeFileSync(`${dir}/provenance.json`, JSON.stringify(provenance, null, 2) + '\n')
          console.log(`packed ${meta.filename} (${bytes.length} bytes, sha256 ${sha256})`)
          NODE

      - name: Verify plugin tarball contents and import closure
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find dist/plugin -maxdepth 1 -name '*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          TARBALL="${TARBALLS[0]}"
          tar -tzf "$TARBALL" | sort > dist/plugin/tarball-files.txt
          for required in \
            package/LICENSE \
            package/THIRD-PARTY-NOTICES.md \
            package/lib/index.js \
            package/lib/index.d.ts \
            package/qml/main.qml \
            package/native/main.cpp; do
            grep -qx "$required" dist/plugin/tarball-files.txt || {
              echo "::error::tarball is missing $required"
              exit 1
            }
          done
          tar -xOf "$TARBALL" package/LICENSE | grep -qi 'MIT License'
          tar -xOf "$TARBALL" package/THIRD-PARTY-NOTICES.md | grep -qi 'third-party'
          UNPACK="$RUNNER_TEMP/dsh-qt-plugin-unpack"
          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          tar -xzf "$TARBALL" -C "$UNPACK"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs'
          import { dirname, extname, join, relative, resolve } from 'node:path'

          const root = process.env.RUNNER_TEMP + '/dsh-qt-plugin-unpack/package'
          const pkg = JSON.parse(readFileSync(join(root, 'package.json'), 'utf8'))
          assert.equal(pkg.name, '@deepseek-ai/dsh-qt-app')
          assert.equal(pkg.main, 'lib/index.js')
          assert.equal(pkg.exports['.'].default, './lib/index.js')

          const files = []
          const walk = (dir) => {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name)
              if (entry.isDirectory()) walk(path)
              else files.push(path)
            }
          }
          walk(join(root, 'lib'))
          const scripts = files.filter((file) => extname(file) === '.js')
          assert.ok(scripts.length > 40, `expected built lib scripts, found ${scripts.length}`)
          const missing = []
          const relativePattern = /(?:\bfrom\s*|\bimport\s*\()\s*['"](\.[^'"]+)['"]/g
          for (const file of scripts) {
            const text = readFileSync(file, 'utf8')
            for (const match of text.matchAll(relativePattern)) {
              const spec = match[1]
              let target = resolve(dirname(file), spec)
              const candidates = [target, `${target}.js`, `${target}.d.ts`, join(target, 'index.js')]
              if (!candidates.some((candidate) => existsSync(candidate) && statSync(candidate).isFile()))
                missing.push(`${relative(root, file)} -> ${spec}`)
            }
          }
          assert.deepEqual(missing, [], `tarball import closure is incomplete: ${missing.join(', ')}`)
          console.log(`checked ${scripts.length} lib scripts; relative import closure complete`)
          NODE

      - name: Activate the packed plugin in a clean host closure
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(realpath "$(find dist/plugin -maxdepth 1 -name '*.tgz' -print -quit)")"
          HOST="$RUNNER_TEMP/dsh-qt-plugin-host"
          rm -rf "$HOST"
          mkdir -p "$HOST"
          cd "$HOST"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "$TARBALL"
          PLUGIN_TARBALL="$TARBALL" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { Context } from '@deepseek-ai/cordis'
          import plugin, { apply, inject, name, version } from '@deepseek-ai/dsh-qt-app'

          assert.equal(typeof apply, 'function')
          assert.deepEqual(inject, [])
          assert.equal(plugin.apply, apply)
          const bridge = {
            version: 't58-fixture',
            renderMarkdown: (text) => `<p>${text}</p>`,
            highlightCode: (code) => `<code>${code}</code>`,
          }
          const ctx = new Context()
          await ctx.plugin(plugin, {
            bridge,
            autoLaunch: false,
            autoStartEventLoop: false,
            napiPath: '/nonexistent/dsh-qt-napi/qt-bridge.node',
          })
          assert.ok(ctx.qtRenderer, 'plugin did not register ctx.qtRenderer')
          assert.equal(ctx.qtRenderer.stats.name, name)
          assert.equal(ctx.qtRenderer.stats.version, version)
          assert.equal(ctx.qtRenderer.qmlEntry, 'qrc:/qml/main.qml')
          assert.equal(await ctx.qtRenderer.renderMarkdown('artifact'), '<p>artifact</p>')
          console.log(`activated ${name}@${version} from ${process.env.PLUGIN_TARBALL}`)
          NODE

      - name: Upload JavaScript plugin
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-qt-app-plugin
          path: |
            dist/plugin/*.tgz
            dist/plugin/*.sha256
            dist/plugin/provenance.json
            dist/plugin/tarball-files.txt
          if-no-files-found: error
          retention-days: 7

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libfuse2 pigz

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # The addon artifact is unpacked into the sibling layout the loader and the
      # CMake staging logic both understand: <root>/dsh-qt-napi/prebuild/<triple>/.
      - name: Download addon prebuild
        uses: actions/download-artifact@v4
        with:
          name: napi-prebuild-${{ runner.os }}-${{ runner.arch }}
          path: dsh-qt-napi/prebuild

      - name: Show addon layout
        shell: bash
        run: ls -la dsh-qt-napi/prebuild/*/ || true

      # Writing DSH_QT_NAPI_DIR into GITHUB_ENV makes it visible to every later
      # step, including `pnpm package`, which CMakeLists.txt picks up through the
      # environment fallback (no -D flag needs threading through npm scripts).
      - name: Point CMake at the addon
        shell: bash
        run: echo "DSH_QT_NAPI_DIR=${GITHUB_WORKSPACE}/dsh-qt-napi" >> "$GITHUB_ENV"

      - name: Configure (CMake)
        run: node scripts/gate.mjs -- cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: node scripts/gate.mjs -- cmake --build build --config Release --parallel

      - name: Package
        run: node scripts/gate.mjs -- pnpm package

      # Inspect the archive CPack actually produced, not the install rules that
      # fed it. A package without qt-bridge.node still starts but silently loses
      # the Native Markdown renderer; a package carrying ANOTHER platform's binary
      # starts too, because the loader's require() failure degrades instead of
      # throwing (T29-A). Only unpacking the archive shows either one.
      - name: Assert the packaged archive carries the addon for this target
        shell: bash
        run: |
          if [ ! -f build/CPackConfig.cmake ]; then
            echo "::error::CPack was not configured"
            exit 1
          fi
          ls -la dist/package/ 2>/dev/null || true

          # The triple is the one the packaged app computes at runtime, so take it
          # from the same source: Node's process.platform/process.arch.
          triple="$(node -p "process.platform + '-' + process.arch")"
          archive=""
          for candidate in dist/package/*.tar.gz dist/package/*.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; break; fi
          done
          if [ -z "$archive" ]; then
            echo "::error::pnpm package produced no archive in dist/package/"
            exit 1
          fi

          rm -rf unpacked && mkdir -p unpacked
          case "$archive" in
            *.tar.gz) tar -xzf "$archive" -C unpacked ;;
            *.zip) 7z x -y -ounpacked "$archive" > /dev/null ;;
            *) echo "::error::unsupported archive type: $archive"; exit 1 ;;
          esac
          root="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "checking $archive (triple $triple) in $root"

          # --expect-source is the artifact this job downloaded and staged from, so
          # the packaged bytes must match it exactly: a substitution of any kind
          # fails here rather than at the user's first Markdown message.
          node scripts/check-package-addon.mjs \
            --dir "$root" \
            --triple "$triple" \
            --expect-source "dsh-qt-napi/prebuild/$triple/qt-bridge.node"

      - name: Stage executable
        shell: bash
        run: |
          # dist/bin keeps the staged executable separate from dist/package/,
          # otherwise the two uploads would nest one artifact inside the other.
          mkdir -p dist/bin
          found=0
          for candidate in \
            build/dsh-qt-app \
            build/dsh-qt-app.exe \
            build/Release/dsh-qt-app.exe \
            build/dsh-qt-app.app; do
            if [ -e "$candidate" ]; then
              cp -R "$candidate" dist/bin/ 2>/dev/null || true
              echo "staged $candidate"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no built executable found under build/"
            find build -maxdepth 3 -name 'dsh-qt-app*' -print 2>/dev/null || true
            exit 1
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: dsh-qt-app-${{ runner.os }}-${{ runner.arch }}
          path: dist/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-qt-app-package-${{ runner.os }}-${{ runner.arch }}
          path: dist/package/
          if-no-files-found: error
          retention-days: 7
